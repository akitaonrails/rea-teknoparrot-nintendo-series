[package]
name = "nintendo-launcher"
description = "One launcher for F-Zero AX and the Mario Kart Arcade GP games"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nintendo-launcher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rea-launcher.workspace = true
rea-launcher-native.workspace = true
rea-launcher-ui.workspace = true
rea-launcher-win32.workspace = true
nintendo-core = { path = "../nintendo-core" }
signal-hook = "0.3"

[build-dependencies]
rea-launcher-build.workspace = true

[dev-dependencies]
rea-launcher-ui = { workspace = true, features = ["testing"] }
tempfile = "3"
