name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Shell scripts
        run: for f in scripts/*.sh; do sh -n "$f"; done

  # The Windows build: linted for its target and its tests run under Wine,
  # headless (rea-launcher-sdk STANDARDS: Windows code is run, not only
  # linted). GE-Proton's Wine (the Linux package's runner, pinned in
  # scripts/build-components.sh): Ubuntu's Wine 9 does not follow directory
  # junctions, which the Windows runtime folder uses.
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 lld wine wine64 curl
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - name: SDL2 (pinned MinGW package)
        run: scripts/build-launcher.sh sdl2
      - name: Clippy (x86_64-pc-windows-gnu)
        run: |
          sdl="$PWD/dist/sdl2/$(sed -n 's/^dir=//p' packaging/sdl2.pin)/lib"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=lld -L $sdl"
          cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
      - name: Wine (GE-Proton, pinned)
        run: |
          scripts/build-components.sh "$RUNNER_TEMP/c" runner
          echo "$RUNNER_TEMP/c/runner/bin" >> "$GITHUB_PATH"
      - name: Tests under Wine
        run: |
          sdl="$PWD/dist/sdl2/$(sed -n 's/^dir=//p' packaging/sdl2.pin)/lib"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=lld -L $sdl"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER=wine
          export WINEPREFIX="$RUNNER_TEMP/wineprefix" WINEDEBUG=-all
          export WINEPATH="Z:$(printf '%s' "$PWD/dist/sdl2" | tr / '\\')"
          wine --version
          cargo test --workspace --locked --target x86_64-pc-windows-gnu
