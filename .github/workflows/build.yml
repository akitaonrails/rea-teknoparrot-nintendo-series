name: build

# Checks every push (the SDK's launcher-ci: fmt, tests, clippy, deny, the
# family rules), runs the Windows-target tests under Wine, builds both
# packages (Linux and Windows, every component bundled: Dolphin built from
# its tag for Linux and the project's own release for Windows,
# windowsarcadeloader with its Wine, the launcher's SDL) and, on a vX.Y.Z
# tag, publishes them once all of that passed (the SDK's launcher-release).
# Never in a package: game files.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.12.6
    with:
      concurrency-key: linux
      rust-target: ""
      apt-packages: libsdl2-dev
      shell-syntax: scripts/*.sh sdk/packaging/*.sh sdk/rea-play.sh
      shell-tests: ""
      imports-check: false

  # The Windows build: linted for its target and its tests run under Wine,
  # headless (STANDARDS: Windows code is run, not only linted), with the
  # SDK's pinned SDL2 MinGW package linked in. GE-Proton's Wine (the Linux
  # package's runner): Ubuntu's Wine 9 does not follow directory junctions,
  # which the Windows runtime folder uses.
  windows-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 lld curl
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - name: SDL2 (the SDK's pinned MinGW package)
        run: sdk/packaging/build-launcher.sh sdl2
      - name: Wine (GE-Proton, pinned)
        run: |
          scripts/build-components.sh "$RUNNER_TEMP/c" runner
          echo "$RUNNER_TEMP/c/runner/bin" >> "$GITHUB_PATH"
      - name: Clippy (x86_64-pc-windows-gnu)
        run: |
          sdl="$(ls -d "$PWD"/dist/sdl2/SDL2-*/x86_64-w64-mingw32)/lib"
          echo "SDL2_LIB=$sdl" >> "$GITHUB_ENV"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=lld -L $sdl"
          cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
      # GE-Proton's runner has no wineboot, which sdk/scripts/wine-test
      # needs: the tests run through `wine` directly, in a fresh prefix,
      # with no display (a message never opens a window)
      - name: Tests under Wine
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=lld -L $SDL2_LIB"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER=wine
          export WINEPREFIX="$RUNNER_TEMP/wineprefix" WINEDEBUG=-all
          export WINEPATH="Z:$(printf '%s' "$PWD/dist/sdl2" | tr / '\\')"
          wine --version
          cargo test --workspace --locked --target x86_64-pc-windows-gnu

  packages:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    needs: [ci, windows-tests]
    timeout-minutes: 240
    steps:
      - name: System packages
        run: |
          apt-get update
          # SDL2 (the launcher); mingw (the payloads); mono (a payload's C# bridge, built by
          # windowsarcadeloader's build.sh); cmake and SDL3's headers (its static build);
          # ninja, evdev, bluez (Dolphin's Linux build); p7zip (Dolphin's Windows release)
          apt-get install -y --no-install-recommends build-essential pkg-config cmake ninja-build git curl \
            ca-certificates xz-utils zip unzip p7zip-full lld libsdl2-dev gcc-mingw-w64 mono-mcs mono-devel \
            libevdev-dev libbluetooth-dev libsystemd-dev libxxf86vm-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl-dev libegl-dev libgles-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-jackd2-dev libsndio-dev \
            libusb-1.0-0-dev
      - uses: actions/checkout@v5
      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add i686-pc-windows-gnu x86_64-pc-windows-gnu
      - name: Launcher
        run: |
          # libSDL2 ships in lib/ beside the program, found through its RUNPATH
          RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN/lib' cargo build --release --locked -p nintendo-launcher
          mkdir -p dist/linux/lib
          cp target/release/nintendo-launcher dist/linux/
          cp -L "$(ldconfig -p | awk '$1 == "libSDL2-2.0.so.0" && /x86-64/ { print $NF; exit }')" dist/linux/lib/
          cp /usr/share/doc/libsdl2-2.0-0/copyright dist/linux/SDL2-copyright.txt
          readelf -d dist/linux/nintendo-launcher | grep -E "RUNPATH|NEEDED"
      - name: Package
        env:
          # windowsarcadeloader's launcher with SDL3 inside it
          LAUNCHER_FEATURES: sdl3/build-from-source-static
        run: |
          git config --global --add safe.directory '*'
          scripts/package.sh linux
      - name: Windows package
        run: |
          sdk/packaging/build-launcher.sh windows nintendo-launcher
          scripts/package.sh windows
      - name: Allowlists (nothing else ships)
        run: |
          sdk/packaging/smoke-package.sh dist/pkg/NintendoArcadeLauncher-*-linux-x86_64 packaging/allowlist-linux.txt
          sdk/packaging/smoke-package.sh dist/pkg/NintendoArcadeLauncher-*-windows-x86_64.zip packaging/allowlist-windows.txt
      - name: Contents
        run: |
          cd dist/pkg
          ls -l *.tar.gz *.zip
          unzip -l NintendoArcadeLauncher-*-windows-x86_64.zip | grep -v -e "/systemprofiles/" -e "/payloads/"
          tar -tzf NintendoArcadeLauncher-*-linux-x86_64.tar.gz | grep -v -e "/components/runner/" -e "/Sys/" | sort
          tar -xzf NintendoArcadeLauncher-*-linux-x86_64.tar.gz
          for f in */nintendo-launcher */components/wal/arcade-launcher */components/dolphin/dolphin-emu-nogui; do
            echo "$f: $(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          done
          # every library Dolphin asks for is the system's or in its lib/
          LD_LIBRARY_PATH=$(echo */components/dolphin/lib) ldd */components/dolphin/dolphin-emu-nogui
          ! LD_LIBRARY_PATH=$(echo */components/dolphin/lib) ldd */components/dolphin/dolphin-emu-nogui | grep "not found"
          */components/dolphin/dolphin-emu-nogui --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/pkg/NintendoArcadeLauncher-*-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/pkg/NintendoArcadeLauncher-*-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, windows-tests, packages]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-release.yml@v0.12.6
    with:
      package: nintendo-launcher
      artifact-pattern: "{linux,windows}"
